<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpes IA Agentic OS</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   Alpes IA Agentic OS — two themes, "Papier" (light) and "Ardoise" (dark).
   Light is the default; the toggle stamps data-theme on <html>.
   ============================================================ */
:root {
  --bg: #faf8f4;          /* warm paper */
  --surface: #ffffff;
  --sunken: #f2eee7;
  --line: #e5dfd5;
  --line-soft: #efeae2;
  --ink: #211d18;
  --ink-2: #5d564c;
  --ink-3: #948b7e;
  --accent: #cf5520;      /* Alpes IA orange, deepened to hold on paper */
  --accent-ink: #ffffff;
  --accent-soft: #fbeade;
  --good: #3f8a5c;
  --warn: #b07d1c;
  --crit: #c0392b;
  --shadow: 0 1px 2px rgba(33,29,24,.05), 0 8px 24px rgba(33,29,24,.06);
  --shadow-lg: 0 12px 48px rgba(33,29,24,.18);
  --scrim: rgba(60,52,44,.28);
  --canvas-edge: 33,29,24;      /* rgb for canvas strokes */
  --canvas-label-bg: 255,255,255;
  --canvas-label-ink: #211d18;
  --d-knowledge: #2f7cb0; --d-clients: #b96a1c; --d-projects: #bb4468;
  --d-finance: #3d8a58;   --d-stack: #7350bd;  --d-maintenance: #b0532f;
  --d-journal: #96811c;   --d-inbox: #2b857f;  --d-skills: #8a45b0;
  --d-root: #6d6357;
  --font: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 8px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #17150f;          /* warm slate, not black */
  --surface: #1f1c16;
  --sunken: #262218;
  --line: #35301f;
  --line-soft: #292418;
  --ink: #f2ece0;
  --ink-2: #a89e8d;
  --ink-3: #7a7161;
  --accent: #ff8a3d;
  --accent-ink: #17150f;
  --accent-soft: #2e2317;
  --good: #7cc48a;
  --warn: #e0b24f;
  --crit: #e0685c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg: 0 16px 56px rgba(0,0,0,.55);
  --scrim: rgba(0,0,0,.6);
  --canvas-edge: 242,236,224;
  --canvas-label-bg: 31,28,22;
  --canvas-label-ink: #ffffff;
  --d-knowledge: #7fc9f5; --d-clients: #f3b06e; --d-projects: #f38fa4;
  --d-finance: #a8dd94;   --d-stack: #c2a5f0;  --d-maintenance: #eda17b;
  --d-journal: #e9dc95;   --d-inbox: #8fcfc9;  --d-skills: #d5b3ef;
  --d-root: #d8d0c2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 14px; line-height: 1.5;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); color: var(--ink); }
button, input, textarea, select { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- shell ---------- */
.os {
  display: grid; grid-template-columns: var(--left, 340px) 14px 1fr 14px var(--right, 340px);
  height: 100vh; gap: 0; padding: 14px; position: relative;
}

.grip { width: 14px; cursor: col-resize; position: relative; flex-shrink: 0; }
.grip::after { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 3px; height: 34px; border-radius: 2px; background: var(--line); opacity: 0; transition: opacity .15s; }
.grip:hover::after, .grip.on::after { opacity: 1; background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
.col { display: flex; flex-direction: column; gap: 14px; min-height: 0; min-width: 0; }

.w {
  min-width: 0;
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r);
  padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0;
  box-shadow: var(--shadow);
}
.w:last-child { flex: 1; }
.col.left > .w:first-child { flex: 1 1 44%; overflow: hidden; }
.col.left > .w:last-child { flex: 1 1 56%; overflow: hidden; }
.todo { flex: 1 1 auto; min-height: 96px; }
#w-projects { flex: 1 1 34%; overflow: hidden; }
.col.right > .w:nth-child(2) { flex: 1 1 40%; overflow: hidden; }
#apps { overflow-y: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.col.right > .w:last-child { flex: 1 1 26%; overflow: hidden; }
.w-head { display: flex; align-items: center; gap: 10px; }
.w-head h2 {
  margin: 0; font: 600 15px/1.2 var(--font); letter-spacing: -.01em; white-space: nowrap;
  display: flex; align-items: center; gap: 9px; color: var(--ink); flex-shrink: 0;
}
.w-head h2 svg { width: 16px; height: 16px; stroke: var(--accent); fill: none; stroke-width: 1.7; flex-shrink: 0; }
.w-head .meta { margin-left: auto; font: 400 11.5px/1 var(--font); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-head .tag { flex-shrink: 0; }
.syncdot { flex-shrink: 0; margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--good); cursor: default; }
.lbl { font: 500 11.5px/1.4 var(--font); color: var(--ink-3); }
.num { font: 600 34px/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tag {
  font: 500 11px/1 var(--font); padding: 4px 8px; border-radius: 20px;
  border: 1px solid var(--line); color: var(--ink-2); background: var(--surface);
}
.tag.acc { color: var(--accent); border-color: transparent; background: var(--accent-soft); }

.btn {
  font: 500 12.5px/1 var(--font); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer;
  transition: border-color .15s, background .15s, color .15s;
}
.btn:hover { border-color: var(--ink-3); }
.btn.acc { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.acc:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .5; cursor: default; }
.icobtn {
  width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  color: var(--ink-2); cursor: pointer; display: grid; place-items: center; font: 400 16px/1 var(--font); flex-shrink: 0;
}
.icobtn:hover { border-color: var(--ink-3); color: var(--ink); }
.icobtn:disabled { opacity: .35; cursor: default; }

/* ---------- theme switch ---------- */
.skins { position: absolute; left: 16px; top: 20px; display: flex; gap: 2px; z-index: 3; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 20px; padding: 3px; box-shadow: var(--shadow); }
.skins button { border: 0; background: transparent; color: var(--ink-3); cursor: pointer; border-radius: 16px; padding: 5px 12px; font: 500 11.5px/1 var(--font); }
.skins button.on { background: var(--sunken); color: var(--ink); }

/* ---------- mail ---------- */
#gmail { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
.mails { display: grid; gap: 2px; overflow-y: auto; flex: 1 1 0; min-height: 0; align-content: start; margin: 0 -8px; }
a.mail, .mail {
  display: grid; grid-template-columns: 7px 1fr auto; gap: 10px; align-items: start;
  padding: 9px 8px; border-radius: 6px; text-decoration: none; color: inherit;
}
.mail:hover { background: var(--sunken); }
.mail .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 7px; background: transparent; }
.mail.unread .dot { background: var(--accent); }
.mail .from { font: 500 11.5px/1.3 var(--font); color: var(--ink-3); margin-bottom: 2px; }
.mail b { display: block; font: 500 13.5px/1.35 var(--font); color: var(--ink-2); }
.mail.unread b { font-weight: 600; color: var(--ink); }
.mail small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink-3); font-size: 12.5px; line-height: 1.4; margin-top: 2px; }
.mail .when { font: 400 11.5px/1 var(--font); color: var(--ink-3); margin-top: 4px; white-space: nowrap; }
.mail.muted { opacity: .55; }
.mail.muted:hover { opacity: 1; }
.mail .from b.kn { display: inline-block; font: 500 10px/1 var(--font); color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 2px 5px; margin-left: 5px; vertical-align: baseline; }
.mails .more { margin: 8px; text-align: left; font: 500 12px/1.4 var(--font); color: var(--ink-3); background: transparent; border: 1px dashed var(--line); border-radius: 6px; padding: 9px 10px; cursor: pointer; }
.mails .more:hover { border-color: var(--ink-3); color: var(--ink-2); }
#gm-others[hidden] { display: none; }
.projects { display: grid; gap: 2px; overflow-y: auto; overflow-x: hidden; min-height: 0; margin: 0 -8px; }
/* Two lines per project: title + stage + last review, then the next step with
   the push button revealed on hover. */
.pj { min-width: 0; padding: 7px 8px; border-radius: 6px; }
.pj:hover { background: var(--sunken); }
.pj .name { display: flex; align-items: center; gap: 7px; }
.pj .name b { min-width: 0; font: 600 13.5px/1.35 var(--font); color: var(--ink); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pj .name b:hover { color: var(--accent); }
.pj .name .age { margin-left: auto; font: 400 11px/1 var(--font); color: var(--ink-3); white-space: nowrap; }
.pj .line2 { display: flex; align-items: center; gap: 8px; }
.pj .next { flex: 1; min-width: 0; font: 400 12.5px/1.5 var(--font); color: var(--ink-2); cursor: text; border-radius: 4px; padding: 1px 4px; margin-left: -4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pj .next:hover { background: var(--bg); }
.pj .next.empty { color: var(--ink-3); font-style: italic; }
.pj .next[contenteditable="true"] { background: var(--bg); outline: 1px solid var(--accent); cursor: text; white-space: normal; overflow: visible; text-overflow: clip; }
.stagebtn { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; font: 500 10.5px/1 var(--font); text-transform: capitalize; color: var(--ink-3); background: var(--sunken); border: 0; border-radius: 20px; padding: 4px 7px 4px 9px; cursor: pointer; }
.stagebtn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.2; opacity: .6; }
.stagebtn:hover { color: var(--ink); }
.stagemenu { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px; box-shadow: var(--shadow-lg); display: grid; gap: 1px; min-width: 210px; }
.stagemenu button { display: grid; gap: 1px; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 7px 9px; cursor: pointer; }
.stagemenu button:hover { background: var(--sunken); }
.stagemenu button b { font: 600 12.5px/1.3 var(--font); color: var(--ink); text-transform: capitalize; }
.stagemenu button small { font: 400 11.5px/1.3 var(--font); color: var(--ink-3); }
.stagemenu button.on b { color: var(--accent); }
.stagemenu button.on b::after { content: " ✓"; }
.stagebtn.actif { color: var(--good); background: color-mix(in srgb, var(--good) 15%, var(--sunken)); }
.stagebtn.incubation { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, var(--sunken)); }
.stagebtn.terminé { color: var(--ink-3); }
.pj .push { display: none; flex-shrink: 0; white-space: nowrap; font: 500 11px/1 var(--font); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 20px; padding: 5px 9px; cursor: pointer; }
.pj:hover .push { display: inline-block; }
.agenda { display: grid; gap: 1px; }
.ev { display: grid; grid-template-columns: 54px 1fr; gap: 10px; padding: 6px 8px; border-radius: 6px; font-size: 12.5px; color: var(--ink-2); margin: 0 -8px; }
.ev:hover { background: var(--sunken); }
.ev .h { font: 500 12px/1.4 var(--font); color: var(--accent); font-variant-numeric: tabular-nums; padding-top: 1px; }
.ev .h small { display: block; color: var(--ink-3); font-weight: 400; font-size: 11px; }
.ev a { text-decoration: none; }
.ev .t { color: var(--ink); font-weight: 500; }
.ev .t small { display: block; color: var(--ink-3); font-weight: 400; }
.ev .acts { display: none; gap: 5px; margin-top: 5px; }
.ev:hover .acts { display: flex; }
.ev .acts button { font: 500 10.5px/1 var(--font); color: var(--ink-3); background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 4px 8px; cursor: pointer; }
.ev .acts button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.agenda .none { font: 400 12px/1.4 var(--font); color: var(--ink-3); padding: 4px 0; }
.agenda .more { margin: 4px -8px 0; width: calc(100% + 16px); text-align: left; font: 500 11.5px/1.4 var(--font); color: var(--ink-3); background: transparent; border: 1px dashed var(--line); border-radius: 6px; padding: 7px 8px; cursor: pointer; }
.agenda .more:hover { border-color: var(--ink-3); color: var(--ink-2); }
.agenda .scope { font: 400 12px/1.5 var(--font); color: var(--ink-3); border: 1px dashed var(--line); border-radius: 6px; padding: 9px 10px; }
.agenda .scope a { color: var(--accent); }
.mail a { text-decoration: none; color: inherit; display: block; }
.mail .acts { display: none; gap: 5px; margin-top: 7px; }
.mail:hover .acts { display: flex; }
.mail .acts button { font: 500 11px/1 var(--font); color: var(--ink-3); background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 5px 9px; cursor: pointer; }
.mail .acts button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.mail .from b.kn.rule { background: var(--sunken); color: var(--ink-3); }
.hiddenbar { display: flex; align-items: center; gap: 10px; font: 400 12px/1.4 var(--font); color: var(--ink-3); border-top: 1px solid var(--line-soft); padding-top: 10px; }
.hiddenbar button { margin-left: auto; font: 500 12px/1 var(--font); color: var(--accent); background: transparent; border: 0; cursor: pointer; padding: 0; }
.rules summary { font: 500 12px/1.4 var(--font); color: var(--ink-3); cursor: pointer; list-style: none; }
.rules summary::-webkit-details-marker { display: none; }
.rules summary::before { content: "›"; display: inline-block; margin-right: 6px; transition: transform .15s; }
.rules[open] summary::before { transform: rotate(90deg); }
.rules textarea { width: 100%; margin-top: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); font: 400 12.5px/1.5 var(--font); padding: 9px; resize: vertical; outline: none; }
.rules textarea:focus { border-color: var(--accent); }
.wtoggle { margin-left: 6px; width: 24px; height: 24px; padding: 0; border: 0; background: transparent; color: var(--ink-3); cursor: pointer; border-radius: 6px; display: grid; place-items: center; transition: transform .15s; flex-shrink: 0; }
.wtoggle svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; display: block; }
.wtoggle:hover { background: var(--sunken); color: var(--ink); }
.w.collapsed { flex: 0 0 auto !important; gap: 0; }
.w.collapsed .w-body { display: none !important; }
.w.collapsed .wtoggle { transform: rotate(-90deg); }
/* ---- stand-up: a short spoken conversation, twice a day ---- */
.standup { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 28; backdrop-filter: blur(3px); }
.standup[hidden] { display: none; }
.su { width: min(700px, 92vw); max-height: 88vh; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
.su .top { display: flex; align-items: center; gap: 11px; padding: 16px 20px; border-bottom: 1px solid var(--line-soft); }
.su .top .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); display: grid; place-items: center; flex-shrink: 0; }
.su .top .ic svg { width: 15px; height: 15px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
.su .top b { font: 600 15.5px/1.2 var(--font); }
.su .top .step { margin-left: auto; font: 500 12px/1 var(--font); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.su .body { padding: 22px 24px; overflow-y: auto; }
.su .greeting { font: 400 15px/1.6 var(--font); color: var(--ink-2); border-left: 3px solid var(--accent); padding-left: 14px; margin-bottom: 22px; }
.su .q { font: 600 19px/1.4 var(--display); color: var(--ink); margin: 0 0 6px; text-wrap: balance; }
.su .why { font: 400 12.5px/1.5 var(--font); color: var(--ink-3); margin: 0 0 14px; }
.su textarea { width: 100%; min-height: 108px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font: 400 15px/1.6 var(--font); padding: 13px 15px; resize: vertical; outline: none; }
.su textarea:focus { border-color: var(--accent); }
.su .hints { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.su .hints button { font: 500 12.5px/1 var(--font); color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 7px 12px; cursor: pointer; }
.su .hints button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.su .foot { display: flex; align-items: center; gap: 9px; padding: 14px 20px; border-top: 1px solid var(--line-soft); background: var(--bg); }
.su .foot .sp { flex: 1; }
.su .foot .hintkey { font: 400 11.5px/1 var(--font); color: var(--ink-3); }
.su .wait { display: grid; gap: 14px; place-items: center; padding: 46px 0; text-align: center; }
.su .wait p { margin: 0; font: 400 14px/1.6 var(--font); color: var(--ink-2); max-width: 46ch; }
.su .spin { width: 26px; height: 26px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.su .recap { font-size: 14.5px; line-height: 1.65; color: var(--ink-2); }
.su .recap h1, .su .recap h2, .su .recap h3 { font: 600 16px/1.3 var(--font); color: var(--ink); margin: 16px 0 6px; }
.su .recap ul { padding-left: 20px; margin: 0 0 10px; }
.su .recap b { color: var(--ink); }
.su .err { color: var(--crit); font-size: 13.5px; }
.su-launch { display: flex; align-items: center; gap: 8px; }
/* ---- chat: the bottom bar doubles as the agent's input ---- */
.legend { pointer-events: none; }
.chat { width: min(760px, 84%); max-height: 52vh; display: none; flex-direction: column; gap: 10px; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
  box-shadow: var(--shadow-lg); pointer-events: auto; }
.chat.on { display: flex; }
.chat.hist .turn { display: none; }
.chat .turn { display: grid; gap: 6px; }
.chat .me { justify-self: end; max-width: 82%; background: var(--accent-soft); color: var(--ink); border-radius: 12px 12px 4px 12px; padding: 9px 13px; font: 400 14px/1.5 var(--font); }
.chat .bot { font: 400 14.5px/1.65 var(--font); color: var(--ink-2); }
.chat .bot b { color: var(--ink); }
.chat .bot h1, .chat .bot h2, .chat .bot h3 { font: 600 15px/1.3 var(--font); color: var(--ink); margin: 10px 0 4px; }
.chat .bot ul, .chat .bot ol { margin: 0 0 8px; padding-left: 20px; }
.chat .bot code { font: 400 12.5px var(--mono); background: var(--sunken); border-radius: 4px; padding: 2px 5px; }
.chat .bot a { color: var(--accent); cursor: pointer; }
.chat .act { display: flex; align-items: center; gap: 8px; font: 400 12px/1.4 var(--font); color: var(--ink-3); }
.chat .act i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex-shrink: 0; }
.chat .act.run i { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
.chat .card { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 9px; }
.chat .card b { font: 600 13.5px/1.4 var(--font); color: var(--ink); }
.chat .log { display: grid; gap: 2px; }
.chat .log button { display: grid; gap: 2px; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
.chat .log button:hover { background: var(--sunken); }
.chat .log .t { font: 400 13.5px/1.4 var(--font); color: var(--ink); }
.chat .log .m { font: 400 11.5px/1 var(--font); color: var(--ink-3); }
.chat .log .none { font: 400 13px/1.5 var(--font); color: var(--ink-3); padding: 6px 2px; }
.chat .past { font: 400 14px/1.65 var(--font); color: var(--ink-2); }
.chat .past b { color: var(--ink); }
.chat .card .row { display: flex; gap: 7px; }
/* Three dots rippling while the agent works — it is also the receipt for what
   was just sent, so it appears the instant the message leaves the field. */
.chat .thinking { display: flex; align-items: center; gap: 5px; height: 18px; }
.chat .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .25; animation: think 1.15s ease-in-out infinite; }
.chat .thinking i:nth-child(2) { animation-delay: .16s; }
.chat .thinking i:nth-child(3) { animation-delay: .32s; }
@keyframes think { 30% { opacity: 1; transform: translateY(-3px); } 60%, 100% { opacity: .25; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .chat .thinking i { animation-name: pulse; animation-duration: 1.6s; opacity: 1; }
}
.chat .err { color: var(--crit); font-size: 13px; }
.chat .head { display: flex; align-items: center; gap: 8px; font: 500 11.5px/1 var(--font); color: var(--ink-3); border-bottom: 1px solid var(--line-soft); padding-bottom: 9px; }
.chat .head .sp { flex: 1; }
.chat .head button { border: 0; background: transparent; color: var(--ink-3); cursor: pointer; font: 500 11.5px/1 var(--font); }
.chat .head button:hover { color: var(--accent); }
.search .mode { font: 500 10.5px/1 var(--font); color: var(--ink-3); white-space: nowrap; }
.auth { display: grid; gap: 10px; }
.auth p { margin: 0; color: var(--ink-2); font-size: 13px; }
.auth code { font: 400 12px var(--mono); color: var(--ink-3); background: var(--sunken); padding: 6px 8px; border-radius: 4px; word-break: break-all; }

/* ---------- todo ---------- */
.prog { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
.prog .bar { height: 5px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s ease; }
.prog span { font: 500 12px/1 var(--font); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.todo { display: grid; gap: 1px; overflow-y: auto; min-height: 0; margin: 0 -8px; }
.todo .it { display: grid; grid-template-columns: 18px 1fr auto auto; gap: 11px; align-items: start; padding: 8px; border-radius: 6px; }
.todo .it:hover { background: var(--sunken); }
.todo input { position: absolute; opacity: 0; width: 0; height: 0; }
.todo label.box { width: 17px; height: 17px; border: 1.5px solid var(--line); border-radius: 5px; cursor: pointer; display: grid; place-items: center; margin-top: 1px; background: var(--surface); }
.todo label.box:hover { border-color: var(--accent); }
.todo label.box svg { width: 11px; height: 11px; stroke: var(--accent-ink); stroke-width: 3; fill: none; opacity: 0; }
.todo input:checked + label.box { background: var(--accent); border-color: var(--accent); }
.todo input:checked + label.box svg { opacity: 1; }
.todo .tx { font: 500 13.5px/1.4 var(--font); color: var(--ink); }
.todo .tx small { display: block; font: 400 12px/1.4 var(--font); color: var(--ink-3); margin-top: 1px; }
.todo input:checked ~ .tx { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-3); }
.todo .it.carried .tx small { color: var(--warn); }
.todo .pr { width: 3px; height: 16px; border-radius: 2px; background: transparent; margin-top: 3px; }
.todo .pr.h { background: var(--crit); } .todo .pr.m { background: var(--warn); }
.todo .del { opacity: 0; font: 400 15px/1 var(--font); color: var(--ink-3); cursor: pointer; border: 0; background: transparent; padding: 0 2px; }
.todo .it:hover .del { opacity: 1; }
.todo .del:hover { color: var(--crit); }
.add { display: flex; gap: 10px; align-items: center; border: 1px dashed var(--line); border-radius: 6px; padding: 9px 11px; }
.add input { flex: 1; background: transparent; border: 0; color: var(--ink); font: 400 13px var(--font); outline: none; }
.add input::placeholder { color: var(--ink-3); }

/* ---------- micro apps ---------- */
.mapp { flex-shrink: 0; padding: 8px 4px; border-radius: 6px; min-width: 0; }
.mapp:hover { background: var(--sunken); }
.mapp .row1 { display: flex; align-items: center; gap: 9px; min-width: 0; margin-bottom: 7px; }
.mapp .ic.sm { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--accent-soft); flex-shrink: 0; }
.mapp .ic.sm svg { width: 13px; height: 13px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
.mapp .head-link { flex: 1; min-width: 0; cursor: pointer; font: 500 13.5px/1.3 var(--font); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.mapp .head-link:hover { color: var(--accent); }
.mapp .head-link .live { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex-shrink: 0; animation: pulse 1.2s ease-in-out infinite; }
.mapp .act { display: flex; gap: 5px; flex-wrap: wrap; padding-left: 33px; }
#apps.w-body { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.btn.sm { font-size: 11.5px; padding: 5px 8px; }
.run { display: grid; grid-template-columns: 7px 1fr auto; gap: 9px; align-items: center; font-size: 12.5px; padding: 6px 7px; cursor: pointer; border-radius: 6px; color: var(--ink-2); }
.run:hover { background: var(--sunken); color: var(--ink); }
.run i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.run.running i { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
.run.done i { background: var(--good); } .run.failed i { background: var(--crit); }
.run > span:last-child { font: 500 11px/1 var(--font); color: var(--ink-3); white-space: nowrap; }
.run .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; color: inherit; font: inherit; }
.run { align-items: start; }
.run i { margin-top: 5px; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- produced files ---------- */
.arts { display: grid; gap: 1px; margin: 0 -8px; overflow-y: auto; min-height: 0; }
.art { min-width: 0; overflow-wrap: anywhere; display: grid; grid-template-columns: 16px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.art:hover { background: var(--sunken); color: var(--ink); }
.art svg { width: 14px; height: 14px; stroke: var(--ink-3); fill: none; stroke-width: 1.6; }
.art span { font: 400 11.5px/1 var(--font); color: var(--ink-3); white-space: nowrap; }

/* ---------- centre / graph ---------- */
.core { position: relative; min-width: 0; overflow: hidden; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.core canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.brand { position: absolute; top: 22px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
.brand h1 { margin: 0; font: 600 26px/1.1 var(--display); letter-spacing: -.01em; display: inline-flex; gap: 11px; align-items: center; color: var(--ink); }
.brand h1 svg { width: 20px; height: 20px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 5px 0 0; font: 400 12.5px/1 var(--font); color: var(--ink-3); }
.hud { position: absolute; bottom: 18px; right: 18px; text-align: right; max-width: 190px; font: 400 11.5px/1.6 var(--font); color: var(--ink-3); z-index: 2; pointer-events: none; }
.hud b { color: var(--ink-2); font-weight: 500; }
.zoom { position: absolute; right: 16px; top: 20px; display: grid; gap: 5px; z-index: 2; }
.zoom button { width: 30px; height: 30px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 6px; cursor: pointer; font: 400 15px/1 var(--font); box-shadow: var(--shadow); }
.zoom button:hover { border-color: var(--accent); color: var(--accent); }

.legend { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 2; pointer-events: none; }
.doms { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 96%; pointer-events: auto; }
.dom { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px/1 var(--font); color: var(--ink-2); border: 1px solid var(--line-soft); padding: 6px 10px; border-radius: 20px; cursor: pointer; background: var(--surface); box-shadow: var(--shadow); }
.dom i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.dom span { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.dom:hover { border-color: var(--c); }
.dom.on { border-color: var(--c); color: var(--ink); box-shadow: inset 0 0 0 1px var(--c), var(--shadow); }
.dom.off { opacity: .4; }
.search { display: flex; align-items: center; gap: 10px; width: 440px; max-width: 80%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 13px; box-shadow: var(--shadow); pointer-events: auto; }
.search:focus-within { border-color: var(--accent); }
.search svg { width: 15px; height: 15px; stroke: var(--ink-3); fill: none; stroke-width: 1.8; }
.search input { flex: 1; background: transparent; border: 0; color: var(--ink); font: 400 13.5px var(--font); outline: none; }
.search input::placeholder { color: var(--ink-3); }
.search kbd { font: 500 11px/1 var(--font); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; color: var(--ink-3); }

/* ---------- note panel ---------- */
.panel {
  position: absolute; right: 16px; top: 62px; width: 400px; min-width: 300px; max-width: 70%;
  max-height: calc(100% - 190px); overflow: auto; resize: horizontal; direction: rtl;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; display: none; gap: 11px; z-index: 4; box-shadow: var(--shadow-lg);
}
.panel > * { direction: ltr; }
.panel.on { display: grid; }
.panel .hd { display: flex; align-items: center; gap: 9px; }
.panel .hd .dm { flex: 1; }
.panel .dm { font: 500 11.5px/1 var(--font); }
.panel b.t { font: 600 19px/1.25 var(--display); color: var(--ink); text-wrap: balance; }
.panel .path { font: 400 11px/1.4 var(--mono); color: var(--ink-3); word-break: break-all; }
.panel .tags { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.panel .links { display: grid; gap: 1px; }
.panel .links div { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); cursor: pointer; padding: 5px 6px; border-radius: 5px; }
.panel .links div:hover { background: var(--sunken); color: var(--ink); }
.panel .links i { width: 7px; height: 7px; border-radius: 50%; }
.panel .body { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; max-height: 40vh; overflow: auto; border-top: 1px solid var(--line-soft); padding-top: 11px; }
.panel .body h1, .panel .body h2, .panel .body h3 { font: 600 14px/1.3 var(--font); color: var(--ink); margin: 10px 0 4px; }
.panel .body p { margin: 0 0 8px; } .panel .body ul, .panel .body ol { margin: 0 0 8px; padding-left: 18px; }
.panel .body a { color: var(--accent); cursor: pointer; }
.panel .body blockquote { margin: 0 0 8px; padding: 6px 11px; border-left: 2px solid var(--accent); background: var(--sunken); }
.panel .row { display: flex; gap: 7px; }
.st { font: 600 11px/1 var(--font); }
.st.v { color: var(--good); } .st.d { color: var(--warn); }

/* ---------- overlays ---------- */
.modal, .viewer, .appview { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 25; backdrop-filter: blur(3px); }
.modal[hidden], .viewer[hidden], .appview[hidden] { display: none; }
.appview { z-index: 24; }
.dlg { width: 560px; max-width: 92vw; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow-lg); }
.dlg .w-head h2 { font-size: 16px; }
.dlg textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font: 400 14px/1.55 var(--font); padding: 12px; resize: vertical; outline: none; }
.dlg textarea:focus { border-color: var(--accent); }
.dlg select.btn { padding: 8px 10px; }

.vw { width: min(1040px, 92vw); height: min(86vh, 940px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; box-shadow: var(--shadow-lg); }
.vw .top { display: flex; align-items: center; gap: 11px; padding: 15px 18px; border-bottom: 1px solid var(--line-soft); }
.vw .top b { font: 600 15.5px/1.2 var(--font); color: var(--ink); }
.vw .top .ext { font: 500 11px/1 var(--font); color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 5px 8px; text-transform: uppercase; letter-spacing: .04em; }
.vw .top .sp { flex: 1; }
.vw .doc { overflow: auto; padding: 26px 32px; font-size: 15px; line-height: 1.7; color: var(--ink-2); max-width: 78ch; margin: 0 auto; width: 100%; }
.vw .doc h1 { font: 600 27px/1.2 var(--display); color: var(--ink); margin: 26px 0 12px; letter-spacing: -.01em; }
.vw .doc h2 { font: 600 20px/1.3 var(--display); color: var(--ink); margin: 26px 0 10px; }
.vw .doc h3 { font: 600 15px/1.35 var(--font); color: var(--accent); margin: 20px 0 6px; }
.vw .doc p { margin: 0 0 12px; } .vw .doc ul, .vw .doc ol { margin: 0 0 12px; padding-left: 22px; }
.vw .doc li { margin: 4px 0; } .vw .doc b { color: var(--ink); font-weight: 600; }
.vw .doc a { color: var(--accent); }
.vw .doc blockquote { margin: 0 0 14px; padding: 10px 16px; border-left: 3px solid var(--accent); background: var(--sunken); color: var(--ink); border-radius: 0 6px 6px 0; }
.vw .doc hr { border: 0; border-top: 1px solid var(--line-soft); margin: 22px 0; }
.vw .doc code { font: 400 13px var(--mono); background: var(--sunken); border-radius: 4px; padding: 2px 5px; }
.vw .doc pre { background: var(--sunken); border-radius: 8px; padding: 14px; overflow-x: auto; font: 400 12.5px/1.6 var(--mono); }
.vw .doc pre code { background: none; padding: 0; }
.vw .doc table { border-collapse: collapse; width: 100%; margin: 0 0 16px; font-size: 13.5px; }
.vw .doc th, .vw .doc td { border-bottom: 1px solid var(--line-soft); padding: 9px 11px; text-align: left; vertical-align: top; }
.vw .doc th { color: var(--ink); font-weight: 600; border-bottom: 1.5px solid var(--line); }
.vw .doc.log { font: 400 12.5px/1.7 var(--mono); white-space: pre-wrap; color: var(--ink-3); max-width: none; }
.vw iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.vw .bottom { display: flex; gap: 9px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line-soft); }
.vw .bottom .files { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.vw .bottom .files button { font: 500 12px/1 var(--font); border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
.vw .bottom .files button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.av { width: min(900px, 92vw); height: min(86vh, 940px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; box-shadow: var(--shadow-lg); }
.av .top { display: flex; align-items: center; gap: 13px; padding: 18px 20px; border-bottom: 1px solid var(--line-soft); }
.av .top .ic { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); flex-shrink: 0; }
.av .top .ic svg { width: 19px; height: 19px; stroke: var(--accent); fill: none; stroke-width: 1.7; }
.av .top b { font: 600 19px/1.2 var(--display); display: block; color: var(--ink); }
.av .top small { color: var(--ink-3); font-size: 12.5px; }
.av .bar { display: flex; gap: 9px; align-items: center; padding: 13px 20px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; background: var(--bg); }
.av .bar .sp { flex: 1; }
.av .bar .stat { font: 400 12px/1 var(--font); color: var(--ink-3); }
.av .bar .stat b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.av .body { overflow-y: auto; padding: 8px 20px 22px; }
.av h3 { font: 500 12px/1 var(--font); color: var(--ink-3); margin: 20px 0 10px; }
.av .empty { color: var(--ink-3); font-size: 13.5px; padding: 22px 0; }
.entry { border: 1px solid var(--line-soft); border-radius: var(--r); padding: 14px 16px; margin-bottom: 9px; display: grid; gap: 10px; border-left: 3px solid var(--line); background: var(--surface); }
.entry.done { border-left-color: var(--good); } .entry.failed { border-left-color: var(--crit); }
.entry.running { border-left-color: var(--warn); } .entry.interrupted { border-left-color: var(--ink-3); }
.entry .hd { display: flex; align-items: baseline; gap: 12px; }
.entry .hd b { font: 600 14.5px/1.4 var(--font); flex: 1; color: var(--ink); }
.entry .hd .when { font: 400 12px/1 var(--font); color: var(--ink-3); white-space: nowrap; }
.entry .meta { display: flex; gap: 12px; flex-wrap: wrap; font: 400 12px/1 var(--font); color: var(--ink-3); align-items: center; }
.entry .meta .s { font-weight: 600; }
.entry.done .meta .s { color: var(--good); } .entry.failed .meta .s { color: var(--crit); }
.entry.running .meta .s { color: var(--warn); } .entry.interrupted .meta .s { color: var(--ink-3); }
.entry .from { font: 400 12px/1.4 var(--font); color: var(--accent); }
.entry .fl { display: flex; gap: 7px; flex-wrap: wrap; }
.entry .fl button, .orph button { display: inline-flex; align-items: center; gap: 8px; font: 500 12.5px/1 var(--font); border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); border-radius: 6px; padding: 8px 11px; cursor: pointer; }
.entry .fl button:hover, .orph button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.entry .fl button i, .orph button i { font: 500 10px/1 var(--font); color: var(--accent); font-style: normal; text-transform: uppercase; letter-spacing: .04em; }
.entry .acts { display: flex; gap: 7px; }
.entry .acts .btn { padding: 7px 11px; font-size: 12px; }
.orph { display: flex; gap: 7px; flex-wrap: wrap; }

.toast { position: fixed; bottom: 22px; right: 22px; z-index: 40; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 12px 16px; font: 500 13px var(--font); box-shadow: var(--shadow-lg); }
.toast.bad { background: var(--crit); color: #fff; }

@media (max-width: 1240px) { .os { --left: 300px; --right: 300px; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>

    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>

</svg>

<div class="os">
  <aside class="col left">
    <section class="w" data-widget="inbox">
      <div class="w-head">
        <h2><svg><use href="#i-mail"/></svg>Boîte de réception</h2>
        <span class="tag acc" id="gm-label">ALPES-IA</span>
        <i class="syncdot" id="gm-sync" title="Synchronisation"></i>
        <button class="wtoggle" aria-label="Réduire ou déplier" data-w="inbox" title="Réduire"><svg><use href="#i-chev"/></svg></button>
      </div>
      <div class="w-body" id="gmail"><span class="lbl">Chargement…</span></div>
    </section>

    <section class="w" data-widget="today">
      <div class="w-head">
        <h2><svg><use href="#i-list"/></svg>Aujourd'hui</h2>
        <span class="meta" id="today"></span>
        <button class="wtoggle" aria-label="Réduire ou déplier" data-w="today" title="Réduire"><svg><use href="#i-chev"/></svg></button>
      </div>
      <div class="w-body">
        <div class="prog"><div class="bar"><i id="pbar"></i></div><span id="pcount">0/0</span></div>
        <div class="todo" id="todo"></div>

<script>
const $ = s => document.querySelector(s);
const api = (p, opt) => fetch(p, opt).then(r => r.json());
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rel = iso => { const m = (Date.now() - new Date(iso)) / 6e4; return m < 60 ? `${Math.max(1, m | 0)} min` : m < 1440 ? `${m / 60 | 0}h` : `${m / 1440 | 0} j`; };

/* ---------- skins ---------- */
/* ---------- theme: Papier (light) / Ardoise (dark) ---------- */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function setTheme(t, remember) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('.skins button').forEach(b => b.classList.toggle('on', b.dataset.theme === t));
  if (remember) { try { localStorage.setItem('theme', t); } catch (e) {} }
}
document.querySelectorAll('.skins button').forEach(b => b.onclick = () => setTheme(b.dataset.theme, true));
setTheme((() => { try { return localStorage.getItem('theme'); } catch (e) { return null; } })()
  ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

/* ---------- todo (brain/journal/todo.md in the second brain) ---------- */
let todo = { items: [], carried: [] };
async function loadTodo() { todo = await api('/api/todo'); renderTodo(); }
async function saveTodo() { todo = await api('/api/todo', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ items: todo.items }) }); renderTodo(); }
function renderTodo() {
  const el = $('#todo');
  const row = (t, i, carried) => `<div class="it${carried ? ' carried' : ''}"><input type="checkbox" id="td${carried ? 'c' : ''}${i}" data-i="${i}" data-c="${carried ? 1 : 0}" ${t.done ? 'checked' : ''}><label class="box" for="td${carried ? 'c' : ''}${i}"><svg><use href="#i-check"/></svg></label><div class="tx">${esc(t.t)}<small>${carried ? 'reporté du ' + t.from + (t.s ? ' · ' : '') : ''}${esc(t.s)}</small></div>${carried ? '<span></span>' : `<button class="del" data-i="${i}" title="Supprimer">×</button>`}<i class="pr ${t.p}"></i></div>`;
  el.innerHTML = todo.items.map((t, i) => row(t, i, false)).join('') + todo.carried.map((t, i) => row(t, i, true)).join('');
  const d = todo.items.filter(t => t.done).length;
  $('#pbar').style.width = todo.items.length ? (d / todo.items.length * 100) + '%' : '0';
  $('#pcount').textContent = `${d}/${todo.items.length}`;
  $('#todo-src').textContent = 'second-brain/brain/journal/todo.md';
}
$('#todo').addEventListener('change', async e => {
  const i = +e.target.dataset.i;
  if (e.target.dataset.c === '1') {
    // close it in the day it came from, rather than copying it into today
    const t = todo.carried[i];
    todo = await api('/api/todo/carried', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ from: t.from, t: t.t, done: e.target.checked }) });
    renderTodo();
    return;
  }
  todo.items[i].done = e.target.checked;
  saveTodo();
});
$('#todo').addEventListener('click', e => { if (e.target.classList.contains('del')) { todo.items.splice(+e.target.dataset.i, 1); saveTodo(); } });
$('#newtodo').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.value.trim()) return;
  let t = e.target.value.trim(), p = '';
  if (t.endsWith('!!')) { p = 'h'; t = t.slice(0, -2).trim(); } else if (t.endsWith('!')) { p = 'm'; t = t.slice(0, -1).trim(); }
  const [text, s = ''] = t.split(' — ');
  todo.items.push({ t: text, s, p, done: false }); e.target.value = ''; saveTodo();
});
$('#today').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

/* ---------- gmail ---------- */
async function loadGmail(refresh) {
  const el = $('#gmail');
  const g = await api('/api/gmail' + (refresh ? '?refresh=1' : ''));
  if (g.error) { el.innerHTML = `<div class="auth"><p style="color:var(--crit)">${esc(g.error)}</p><a class="btn" href="/auth/google">Ré-autoriser</a></div>`; return; }
  if (g.needsAuth) {
    el.innerHTML = `<div class="auth">${g.hasSecret ? `<p>Autorise l'accès en lecture à ta boîte Gmail (label ${esc(cfg.gmail.label)}).</p><a class="btn acc" href="/auth/google">Connecter Gmail</a>` : `<p>Dépose le client OAuth Google (type « Desktop app ») dans :</p><code>credentials/client_secret.json</code><p>puis relance le serveur.</p>`}</div>`;
    return;
  }
  $('#gm-sync').title = 'Synchronisé ' + rel(g.syncedAt);
  const senderRule = a => g.senders?.[a]?.rule;
  const row = t => `<div class="mail${t.unread ? ' unread' : ''}${t.bucket !== 'personne' ? ' muted' : ''}" title="${esc(t.why.join(' · '))}">
      <i class="dot"></i>
      <div>
        <div class="from">${esc(t.from)}${t.count > 1 ? ' · ' + t.count : ''}${t.known ? ' <b class="kn">connu</b>' : ''}${senderRule(t.addr) ? ` <b class="kn rule">${senderRule(t.addr) === 'allow' ? 'toujours' : 'jamais'}</b>` : ''}</div>
        <a href="${t.url}" target="_blank" rel="noopener"><b>${esc(t.subject)}</b></a>
        <small>${esc(t.snippet.slice(0, 110))}</small>
        <div class="acts">
          <button data-hide="${esc(t.id)}" data-subject="${esc(t.subject)}" data-from="${esc(t.from)}" title="Masquer ce fil, rien à répondre">Traité</button>
          <button data-sender="${esc(t.addr)}" data-rule="${senderRule(t.addr) === 'allow' ? 'none' : 'allow'}" title="Toujours afficher cet expéditeur">${senderRule(t.addr) === 'allow' ? 'Ne plus prioriser' : 'Toujours'}</button>
          <button data-sender="${esc(t.addr)}" data-rule="${senderRule(t.addr) === 'deny' ? 'none' : 'deny'}" title="Ne plus jamais afficher cet expéditeur">${senderRule(t.addr) === 'deny' ? 'Réautoriser' : 'Jamais'}</button>
        </div>
      </div>
      <span class="when">${rel(t.date)}</span>
    </div>`;
  const noise = g.counts.auto + g.counts.bulk;
  const noiseLabel = `Voir les ${noise} messages écartés · ${g.counts.auto} automatiques, ${g.counts.bulk} newsletters`;
  el.innerHTML = `<div style="display:flex;gap:12px;align-items:center"><span class="num">${g.total}</span><div class="lbl" style="line-height:1.5">à traiter${g.unreadKept ? `<br>dont ${g.unreadKept} non lu${g.unreadKept > 1 ? 's' : ''}` : '<br>tous lus'}</div></div>
    <div class="mails">${g.threads.length ? g.threads.map(row).join('') : '<span class="lbl" style="padding:8px">Rien qui demande une réponse.</span>'}
      ${noise ? `<button class="more" id="gm-more">${noiseLabel}</button><div id="gm-others" hidden>${g.others.map(row).join('')}</div>` : ''}</div>
    ${g.hidden?.length ? `<div class="hiddenbar"><span>${g.hidden.length} fil${g.hidden.length > 1 ? 's' : ''} marqué${g.hidden.length > 1 ? 's' : ''} traité${g.hidden.length > 1 ? 's' : ''}</span><button id="gm-unhide">Tout réafficher</button></div>` : ''}
    <details class="rules"><summary>Consignes de tri</summary><textarea id="gm-notes" rows="3" placeholder="Ce que tu veux que je retienne. Ex : les rappels Noota ne demandent jamais de réponse, la compta IONOS part au classement.">${esc(g.notes ?? '')}</textarea><span class="lbl">Lu par le point du jour. Les boutons, eux, agissent tout de suite.</span></details>
    <div style="display:flex;gap:6px"><a class="btn acc" href="https://mail.google.com/mail/u/0/#label/${encodeURIComponent(g.label)}" target="_blank" rel="noopener">Ouvrir Gmail</a><button class="btn" id="gm-refresh">Rafraîchir</button></div>`;
  $('#gm-refresh').onclick = () => loadGmail(true);
  const post = (url, body) => api(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  el.querySelectorAll('[data-hide]').forEach(b => b.onclick = async () => {
    await post('/api/mail/hide', { id: b.dataset.hide, subject: b.dataset.subject, from: b.dataset.from });
    toast('Fil marqué traité'); loadGmail(true);
  });
  el.querySelectorAll('[data-sender]').forEach(b => b.onclick = async () => {
    await post('/api/mail/sender', { addr: b.dataset.sender, rule: b.dataset.rule === 'none' ? null : b.dataset.rule });
    toast(b.dataset.rule === 'allow' ? 'Expéditeur toujours prioritaire' : b.dataset.rule === 'deny' ? 'Expéditeur écarté' : 'Règle retirée');
    loadGmail(true);
  });
  const unhide = $('#gm-unhide');
  if (unhide) unhide.onclick = async () => { await post('/api/mail/unhide', { all: true }); toast('Fils réaffichés'); loadGmail(true); };
  const notes = $('#gm-notes');
  if (notes) notes.onblur = () => post('/api/mail/notes', { notes: notes.value }).then(() => toast('Consignes enregistrées'));
  const more = $('#gm-more');
  if (more) more.onclick = () => { const o = $('#gm-others'); o.hidden = !o.hidden; more.textContent = o.hidden ? noiseLabel : 'Masquer les messages écartés'; };
}

/* ---------- micro apps + runs ---------- */
let cfg = { apps: [], gmail: {} }, runs = [];
function renderApps() {
  $('#apps').innerHTML = cfg.apps.map(a => {
    const running = runs.some(r => r.app === a.id && r.status === 'running');
    return `<div class="mapp">
      <div class="row1">
        <span class="ic sm"><svg><use href="#i-${a.id === 'devis' ? 'euro' : a.id === 'formation' ? 'course' : 'clock'}"/></svg></span>
        <b class="head-link" data-open="${a.id}">${esc(a.name)}${running ? '<i class="live" title="Un run est en cours"></i>' : ''}</b>
      </div>
      <div class="act">${a.actions.map((ac, i) => `<button class="btn sm${i ? '' : ' acc'}" data-app="${a.id}" data-action="${ac.id}">${esc(ac.label)}</button>`).join('')}</div>
    </div>`;
  }).join('');
  $('#apps').querySelectorAll('button[data-app]').forEach(b => b.onclick = () => openModal(b.dataset.app, b.dataset.action));
  $('#apps').querySelectorAll('[data-open]').forEach(el => el.onclick = () => openApp(el.dataset.open));
}
async function loadDecks() {
  let decks = [];
  try { decks = await (await fetch('/content/cours/decks.json')).json(); } catch (e) {}
  $('#decks').innerHTML = decks.length ? decks.map(d => `<div class="mapp">
      <div class="row1">
        <span class="ic sm"><svg><use href="#i-course"/></svg></span>
        <b>${esc(d.titre)}</b>
      </div>
      <p class="lbl">${esc(d.soustitre || '')}</p>
      <div class="act">${d.clients.map((c, i) => `<button class="btn sm${i ? '' : ' acc'}" data-deck="${esc(d.id)}" data-client="${esc(c.id)}">${esc(c.nom)}</button>`).join('')}</div>
    </div>`).join('') : '<span class="lbl">Aucun support. Ajoute un dossier dans content/cours/.</span>';
  $('#decks').querySelectorAll('button[data-deck]').forEach(b => b.onclick = () => {
    const q = new URLSearchParams({ deck: b.dataset.deck });
    if (b.dataset.client) q.set('client', b.dataset.client);
    open(`/cours/?${q}`, '_blank', 'noopener');
  });
}
let modalCtx = null;
function openModal(appId, actionId, from) {
  const a = cfg.apps.find(x => x.id === appId), ac = a.actions.find(x => x.id === actionId);
  modalCtx = { app: appId, action: actionId, from };
  $('#m-title').textContent = from?.length ? `${a.name} · itérer` : `${a.name} · ${ac.label}`;
  const fromEl = $('#m-from');
  fromEl.hidden = !from?.length;
  if (from?.length) fromEl.textContent = 'Reprend : ' + from.map(f => f.split('/').pop()).join(', ');
  $('#m-brief').value = '';
  $('#m-brief').placeholder = from?.length ? 'Ce que tu veux changer. Ex : raccourcis le module 3, ajoute un exercice sur les webhooks' : ac.placeholder;
  $('#m-model').value = a.model || 'claude-sonnet-5';
  $('#modal').hidden = false; $('#m-brief').focus();
}
$('#m-close').onclick = () => $('#modal').hidden = true;
$('#modal').addEventListener('click', e => { if (e.target === $('#modal')) $('#modal').hidden = true; });
$('#m-run').onclick = async () => {
  const brief = $('#m-brief').value.trim(); if (!brief) { $('#m-brief').focus(); return; }
  const btn = $('#m-run'); btn.disabled = true; btn.textContent = 'Lancement…';
  try {
    const r = await api('/api/runs', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...modalCtx, brief, model: $('#m-model').value }) });
    if (r.error) throw new Error(r.error);
    $('#modal').hidden = true; toast(`Run lancé · ${$('#m-title').textContent}`); loadRuns();
  } catch (e) { toast('Échec du lancement : ' + e.message, true); }
  btn.disabled = false; btn.textContent = 'Lancer';
};
function toast(msg, bad) { const el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 4000); }
async function loadRuns() {
  runs = await api('/api/runs'); renderApps();
  const arts = await api('/api/artifacts');
  $('#runs-meta').textContent = runs.some(r => r.status === 'running') ? `${runs.filter(r => r.status === 'running').length} en cours` : `${arts.length} fichiers`;
  $('#artifacts').innerHTML = arts.length ? arts.map(f => `<div class="art" data-path="${esc(f.path)}"><svg><use href="#i-file"/></svg>${esc(f.name)}<span>${rel(f.mtime)}</span></div>`).join('') : '<span class="lbl">Rien encore. Lance une micro app.</span>';
  $('#artifacts').querySelectorAll('.art').forEach(el => el.onclick = () => openFile(el.dataset.path));
  if (!appview.hidden && avId) openApp(avId);
  if (runs.some(r => r.status === 'running')) setTimeout(loadRuns, 4000);
}

/* ---------- app screen: every run this app ever did, and its files ---------- */
const appview = $('#appview');
let avId = null;
async function openApp(id) {
  avId = id;
  const d = await api('/api/apps/' + encodeURIComponent(id));
  if (d.error) { toast(d.error, true); return; }
  const a = d.app;
  $('#av-name').textContent = a.name;
  $('#av-desc').textContent = a.description;
  $('#av-icon').innerHTML = `<use href="#i-${id === 'devis' ? 'euro' : 'course'}"/>`;
  const done = d.runs.filter(r => r.status === 'done').length;
  const files = d.runs.reduce((n, r) => n + r.files.length, 0) + d.orphans.length;
  $('#av-bar').innerHTML = a.actions.map((ac, i) => `<button class="btn${i ? '' : ' acc'}" data-app="${a.id}" data-action="${ac.id}">${esc(ac.label)}</button>`).join('')
    + `<span class="sp"></span><span class="stat"><b>${d.runs.length}</b> exécutions · <b>${done}</b> réussies · <b>${files}</b> fichiers</span>`;
  $('#av-bar').querySelectorAll('button[data-app]').forEach(b => b.onclick = () => { appview.hidden = true; openModal(b.dataset.app, b.dataset.action); });

  const fileBtn = f => `<button data-p="${esc(f.path)}"><i>${esc(f.ext || 'fichier')}</i>${esc(f.name)}</button>`;
  const STATUS = { done: 'Terminé', failed: 'Échec', running: 'En cours', interrupted: 'Interrompu' };
  const body = $('#av-body');
  body.innerHTML = (d.runs.length ? `<h3>Historique des exécutions</h3>` + d.runs.map(r => `
    <div class="entry ${r.status}">
      <div class="hd"><b>${esc(r.brief.split('\n')[0].slice(0, 120))}</b><span class="when">${when(r.startedAt)}</span></div>
      <div class="meta"><span class="s">${STATUS[r.status] ?? r.status}</span><span>${esc(r.actionLabel ?? r.action)}</span><span>${esc(r.model)}</span>${r.endedAt ? `<span>${dur(r.startedAt, r.endedAt)}</span>` : ''}</div>
      ${r.from?.length ? `<div class="from">↻ itération sur ${r.from.map(f => esc(f.split('/').pop())).join(', ')}</div>` : ''}
      ${r.files.length ? `<div class="fl">${r.files.map(fileBtn).join('')}</div>` : '<div class="meta">Aucun fichier produit</div>'}
      <div class="acts"><button class="btn" data-log="${r.id}">Voir le détail</button>${r.files.length ? `<button class="btn acc" data-iter="${r.id}">Itérer</button>` : ''}<button class="btn" data-again="${r.id}">Relancer</button></div>
    </div>`).join('') : '<p class="empty">Aucune exécution pour le moment. Lance-en une avec les boutons ci-dessus.</p>')
    + (d.orphans.length ? `<h3>Fichiers sans exécution rattachée</h3><div class="orph">${d.orphans.map(fileBtn).join('')}</div>` : '');

  body.querySelectorAll('button[data-p]').forEach(b => b.onclick = () => openFile(b.dataset.p));

function center(n) { const t0 = performance.now(), fx = cam.x, fy = cam.y, fk = cam.k, tk = Math.max(cam.k, 1.8); const off = panel.classList.contains('on') ? (panel.offsetWidth / 2 + 24) / tk : 0; /* keep the node clear of the panel */ (function anim() { const p = Math.min(1, (performance.now() - t0) / 450), e = 1 - Math.pow(1 - p, 3); cam.k = fk + (tk - fk) * e; cam.x = fx + (-n.x - off - fx) * e; cam.y = fy + (-n.y - fy) * e; if (p < 1) requestAnimationFrame(anim); })(); }

/* ---------- resizable side columns ---------- */
(() => {
  const LIMITS = { left: [240, 620], right: [240, 620] };
  const apply = (side, px) => {
    const [min, max] = LIMITS[side];
    const v = Math.max(min, Math.min(max, px));
    document.documentElement.style.setProperty('--' + side, v + 'px');
    try { localStorage.setItem('w-' + side, v); } catch (e) {}
    resize();                       // the canvas needs its new box
  };
  for (const side of ['left', 'right']) {
    try { const v = localStorage.getItem('w-' + side); if (v) document.documentElement.style.setProperty('--' + side, v + 'px'); } catch (e) {}
  }
  document.querySelectorAll('.grip').forEach(grip => {
    grip.addEventListener('pointerdown', e => {
      e.preventDefault(); grip.setPointerCapture(e.pointerId); grip.classList.add('on'); document.body.classList.add('resizing');
      const side = grip.dataset.side;
      const move = ev => apply(side, side === 'left' ? ev.clientX - 14 : innerWidth - ev.clientX - 14);
      const up = () => { grip.classList.remove('on'); document.body.classList.remove('resizing'); grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); };
      grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);
    });
    grip.addEventListener('dblclick', () => apply(grip.dataset.side, 340));
  });
})();

/* ---------- agenda: what is coming, and what the standup reads ---------- */
async function loadAgenda() {
  const c = await api('/api/calendar');
  const el = $('#agenda');
  if (c.needsScope) { el.innerHTML = `<div class="scope">Le calendrier a besoin d'une autorisation supplémentaire. <a href="/auth/google">Autoriser l'agenda</a></div>`; return; }
  if (c.needsAuth) { el.innerHTML = ''; return; }
  if (c.error) {
    // the most common cause is the Calendar API simply not being switched on
    const link = c.error.match(/https:\/\/console\.developers\.google\.com\/apis\S*?(?=["\s\\]|$)/)?.[0];
    el.innerHTML = link
      ? `<div class="scope">L'API Google Calendar n'est pas activée sur ton projet Google Cloud. <a href="${esc(link)}" target="_blank" rel="noopener">L'activer</a>, puis <a href="#" id="cal-retry">réessayer</a>.</div>`
      : `<div class="none">Agenda indisponible : ${esc(c.error.slice(0, 140))}</div>`;
    const retry = $('#cal-retry');
    if (retry) retry.onclick = e => { e.preventDefault(); api('/api/calendar?refresh=1').then(loadAgenda); };
    return;
  }
  const today = new Date().toDateString();
  const next = c.events.slice(0, 4);
  const row = e => {
    const d = new Date(e.start), isToday = d.toDateString() === today;
    const hour = e.allDay ? 'journée' : d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const day = isToday ? '' : d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' });
    const who = [e.calendar, e.organizerName || e.organizer].filter(Boolean).join(' · ');
    return `<div class="ev" title="${esc(who)}">
        <span class="h">${hour}${day ? `<small>${day}</small>` : ''}</span>
        <div><a href="${e.url}" target="_blank" rel="noopener"><span class="t">${esc(e.title)}${e.attendees.length ? `<small>avec ${esc(e.attendees.join(', '))}</small>` : ''}</span></a>
          <div class="acts">
            <button data-evhide="${esc(e.id)}" data-title="${esc(e.title)}" data-start="${esc(e.start)}" title="Masquer cet événement">Masquer</button>
            ${e.organizer ? `<button data-evorg="${esc(e.organizer)}" title="Ne plus jamais afficher les invitations de cette personne">Jamais ${esc(e.organizerName || e.organizer)}</button>` : ''}
          </div>
        </div>

  el.innerHTML = (next.length ? next.map(row).join('') : '<div class="none">Rien de prévu dans les 7 jours.</div>')
    + (hiddenN ? `<button class="more" id="cal-more">${hiddenN} événement${hiddenN > 1 ? 's' : ''} masqué${hiddenN > 1 ? 's' : ''} · réafficher</button>` : '')
    + (needWrite ? `<div class="scope">Pour que l'assistant puisse créer des rendez-vous, <a href="/auth/google">autorise l'écriture de l'agenda</a>.</div>` : '');
  el.querySelectorAll('[data-evhide]').forEach(b => b.onclick = async () => {
    await api('/api/calendar/hide', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: b.dataset.evhide, title: b.dataset.title, start: b.dataset.start }) });
    toast('Événement masqué'); loadAgenda();
  });
  el.querySelectorAll('[data-evorg]').forEach(b => b.onclick = async () => {
    await api('/api/calendar/organizer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ addr: b.dataset.evorg, rule: 'deny' }) });

/* ---------- stand-up: questions grounded in yesterday, answers dictated ---------- */
const su = $('#standup');
let suState = null;   // { slot, greeting, questions[], answers{}, i }

// Answering is meant to take a moment, so an accidental click on the backdrop
// must never close this — only the cross or Escape do. Progress survives a
// close either way: it is saved to localStorage after every answer.
const suClose = () => { su.hidden = true; };
$('#su-close').onclick = suClose;

const suKey = slot => `standup-progress-${slot}`;
function suSaveProgress() {
  if (!suState || suState.phase !== 'ask') return;
  try { localStorage.setItem(suKey(suState.slot), JSON.stringify({ date: suState.date, greeting: suState.greeting, questions: suState.questions, answers: suState.answers, i: suState.i })); } catch (e) {}
}
function suLoadProgress(slot) {
  try { const raw = localStorage.getItem(suKey(slot)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function suClearProgress(slot) { try { localStorage.removeItem(suKey(slot)); } catch (e) {} }

function suRender() {
  const body = $('#su-body'), foot = $('#su-foot'), step = $('#su-step');
  if (!suState) return;
  const { phase, questions, i } = suState;

  if (phase === 'loading') {
    step.textContent = '';
    body.innerHTML = `<div class="wait"><div class="spin"></div><p>Je relis ta veille, ton agenda et tes projets pour te poser les bonnes questions. Une trentaine de secondes.</p></div>`;
    foot.innerHTML = '';
    return;
  }
  if (phase === 'composing') {
    step.textContent = '';
    body.innerHTML = `<div class="wait"><div class="spin"></div><p>Je compose ta journée à partir de tes réponses.</p></div>`;
    foot.innerHTML = '';
    return;
  }
  if (phase === 'done') {
    step.textContent = '';
    body.innerHTML = `<div class="recap">${md(suState.outcome || 'Journée composée.')}</div>`;
    foot.innerHTML = `<span class="hintkey">Consigné dans brain/journal/standup.md</span><span class="sp"></span><button class="btn acc" id="su-ok">Terminé</button>`;
    $('#su-ok').onclick = () => { suClose(); loadTodo(); loadProjects(); };
    return;
  }
  if (phase === 'error') {
    step.textContent = '';
    body.innerHTML = `<p class="err">${esc(suState.error)}</p>`;
    foot.innerHTML = `<span class="sp"></span><button class="btn" id="su-retry">Réessayer</button>`;
    $('#su-retry').onclick = () => startStandup(suState.slot);
    return;
  }

  // one question at a time, the way a stand-up actually goes
  const q = questions[i];
  step.textContent = `${i + 1} / ${questions.length}`;
  const hints = (q.hints ?? []).filter(Boolean);
  body.innerHTML = `
    ${i === 0 && suState.greeting ? `<p class="greeting">${esc(suState.greeting)}</p>` : ''}
    <p class="q">${esc(q.text)}</p>
    ${q.why ? `<p class="why">${esc(q.why)}</p>` : ''}
    <textarea id="su-a" placeholder="Dicte ou écris ta réponse…">${esc(suState.answers[q.id] ?? '')}</textarea>
    ${hints.length ? `<div class="hints">${hints.map(h => `<button data-h="${esc(h)}">${esc(h)}</button>`).join('')}</div>` : ''}`;
  foot.innerHTML = `
    ${i > 0 ? '<button class="btn" id="su-prev">Précédent</button>' : ''}
    <button class="btn" id="su-skip">Passer</button>
    <span class="sp"></span>
    <span class="hintkey">⌘↵ pour continuer</span>
    <button class="btn acc" id="su-next">${i === questions.length - 1 ? 'Composer ma journée' : 'Suivant'}</button>`;

  const ta = $('#su-a');
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  const keep = () => { suState.answers[q.id] = ta.value.trim(); };
  ta.oninput = keep;
  ta.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); suNext(); } };
  body.querySelectorAll('.hints button').forEach(b => b.onclick = () => {
    ta.value = ta.value.trim() ? `${ta.value.trim()} ${b.dataset.h}` : b.dataset.h;
    keep(); ta.focus();
  });
  const prev = $('#su-prev'); if (prev) prev.onclick = () => { keep(); suState.i--; suRender(); };
  $('#su-skip').onclick = () => { suState.answers[q.id] = ''; suAdvance(); };
  $('#su-next').onclick = suNext;
  suSaveProgress();
}
function suNext() { const q = suState.questions[suState.i]; const ta = $('#su-a'); if (ta) suState.answers[q.id] = ta.value.trim(); suAdvance(); }
function suAdvance() {
  if (suState.i < suState.questions.length - 1) { suState.i++; return suRender(); }
  suCompose();
}

async function startStandup(slot) {
  $('#su-title').textContent = slot === 'soir' ? 'Bilan du soir' : 'Point du matin';
  su.hidden = false;

  // resume where it was left off rather than asking the same questions twice
  const today = new Date().toISOString().slice(0, 10);
  const saved = suLoadProgress(slot);
  if (saved && saved.date === today && saved.questions?.length) {
    suState = { phase: 'ask', slot, date: saved.date, greeting: saved.greeting, questions: saved.questions, answers: saved.answers, i: Math.min(saved.i, saved.questions.length - 1) };
    return suRender();
  }

  suState = { phase: 'loading', slot, date: today, answers: {}, i: 0, questions: [] };
  suRender();
  try {
    const r = await api('/api/standup/questions', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ slot }) });
    if (r.error || !r.questions?.length) throw new Error(r.error || 'aucune question produite');
    suState = { ...suState, phase: 'ask', date: r.date || today, greeting: r.greeting, questions: r.questions };
  } catch (e) { suState = { ...suState, phase: 'error', error: e.message }; }
  suRender();
}
async function suCompose() {
  suState.phase = 'composing'; suRender();
  try {
    const r = await api('/api/standup/compose', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ slot: suState.slot, questions: suState.questions, answers: suState.answers }) });
    if (r.error) throw new Error(r.error);
    suClearProgress(suState.slot);
    suState = { ...suState, phase: 'done', outcome: r.outcome };
    loadTodo(); loadProjects(); loadRuns();
  } catch (e) { suState = { ...suState, phase: 'error', error: e.message }; }
  suRender();
}
$('#su-run').onclick = () => startStandup(new Date().getHours() < 14 ? 'matin' : 'soir');

// opens itself once per slot: the morning frames the day, 17h closes it
async function standupOnOpen() {
  try {
    const st = await api('/api/standup/state');
    if (!st.due) return;
    if (st.slot === 'matin' && st.hour >= 5 && st.hour < 14) startStandup('matin');
    else if (st.slot === 'soir' && st.hour >= 17) startStandup('soir');
  } catch (e) { /* never block the dashboard */ }
}

/* ---------- chat: typing filters the graph, Enter asks the agent ---------- */
const chatEl = $('#chat');
let chatId = (() => { try { let v = localStorage.getItem('chat-id'); if (!v) { v = String(Date.now()); localStorage.setItem('chat-id', v); } return v; } catch (e) { return 'default'; } })();
const chatIdSet = v => { chatId = v; localStorage.setItem('chat-id', v); };
let chatOpen = false, chatStream = null, botEl = null, chatBusy = false;

function chatShow(on) {
  chatOpen = on;
  chatEl.classList.toggle('on', on);
  if (on && !chatEl.querySelector('.head')) {
    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = `<span>Assistant · agit sur ton tableau de bord</span><span class="sp"></span><button id="chat-log">Historique</button><button id="chat-clear">Nouvelle conversation</button><button id="chat-hide">Fermer</button>`;
    chatEl.appendChild(head);
    $('#chat-hide').onclick = () => chatShow(false);
    $('#chat-log').onclick = () => (chatEl.querySelector('.histpane') ? chatBack() : chatHistory());
    $('#chat-clear').onclick = async () => {
      await fetch('/api/chat?id=' + encodeURIComponent(chatId), { method: 'DELETE' });
      chatBack();
      chatEl.querySelectorAll('.turn').forEach(n => n.remove());
      if (chatStream) { chatStream.close(); chatStream = null; }
      // a fresh id, so the new conversation gets its own section in the journal
      try { chatIdSet(String(Date.now())); } catch (e) { /* private mode */ }
      toast('Conversation repartie de zéro');
    };
  }
}
const chatAdd = (cls, html) => {
  const el = document.createElement('div');
  el.className = 'turn ' + cls;
  el.innerHTML = html;
  chatEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
  return el;
};

/* Conversations are journalled in the second brain (lib/chatlog.js), so past
   ones can be read back — and the current one redrawn after a page reload. */
const chatBack = () => { chatEl.querySelector('.histpane')?.remove(); chatEl.classList.remove('hist'); };

async function chatHistory() {
  chatEl.classList.add('hist');
  chatEl.querySelector('.histpane')?.remove();
  const pane = document.createElement('div');
  pane.className = 'histpane';
  pane.innerHTML = '<div class="log"><div class="none">…</div></div>';
  chatEl.appendChild(pane);
  const list = await api('/api/chat/log');
  const log = pane.querySelector('.log');
  if (!list.length) { log.innerHTML = '<div class="none">Aucune conversation journalisée pour l\'instant.</div>'; return; }
  log.innerHTML = list.map(c => `<button data-conv="${esc(c.id)}"><span class="t">${esc(c.title)}</span><span class="m">${esc(c.date)} ${esc(c.time)} · ${c.turns} échange${c.turns > 1 ? 's' : ''}${c.actions ? ' · ' + c.actions + ' action' + (c.actions > 1 ? 's' : '') : ''}${c.id === chatId ? ' · en cours' : ''}</span></button>`).join('');
  log.querySelectorAll('[data-conv]').forEach(b => b.onclick = async () => {
    const conv = await api('/api/chat/log?id=' + encodeURIComponent(b.dataset.conv));
    pane.innerHTML = `<div class="head" style="border:0;padding:0"><button id="chat-back">← Toutes les conversations</button></div><div class="past">${md(conv.body || '(vide)')}</div>`;
    pane.querySelector('#chat-back').onclick = () => chatHistory();
  });
}

// After a reload the server may still hold the conversation, but the browser has
// forgotten what was said. The journal is what puts it back on screen.
async function chatReplay() {
  if (chatEl.querySelector('.turn')) return;
  const conv = await api('/api/chat/log?id=' + encodeURIComponent(chatId)).catch(() => null);
  if (!conv?.body || chatEl.querySelector('.turn')) return;
  chatAdd('', `<div class="past">${md(conv.body)}</div>`);
}

function chatConnect() {
  if (chatStream) return;
  chatStream = new EventSource('/api/chat/stream?id=' + encodeURIComponent(chatId));
  chatStream.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'text') {
      // the agent's prose arrives token by token; keep appending to one block
      if (!botEl) { botEl = chatAdd('bot', ''); botEl.dataset.raw = ''; chatEl.querySelector('.thinking')?.remove(); }
      botEl.dataset.raw += m.text;
      botEl.innerHTML = md(botEl.dataset.raw);
      chatEl.scrollTop = chatEl.scrollHeight;
      return;
    }
    if (m.type === 'tool') {
      chatEl.querySelector('.thinking')?.remove();
      const label = { chercher_second_brain: 'cherche dans le second brain', lire_note: 'lit une note', lister_projets: 'regarde les projets', lire_todo: 'regarde la todo', lister_agenda: "regarde l'agenda", lister_mails: 'regarde la boîte', lire_journal_standup: 'relit les stand-ups' }[m.name] ?? m.name.replace(/_/g, ' ');
      const arg = m.input?.requete ?? m.input?.chemin ?? m.input?.titre ?? m.input?.texte ?? '';
      chatAdd('', `<div class="act run"><i></i>${esc(label)}${arg ? ' · ' + esc(String(arg).slice(0, 60)) : ''}</div>`);
      botEl = null;
      return;
    }
    if (m.type === 'confirm') {
      const el = chatAdd('', `<div class="card" data-key="${esc(m.key)}">
        <b>${esc(m.summary)}</b>
        <div class="row"><button class="btn acc" data-yes>Valider</button><button class="btn" data-no>Annuler</button></div>
      </div>`);
      const decide = approved => fetch('/api/chat/decision', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: chatId, key: m.key, approved }) });
      el.querySelector('[data-yes]').onclick = () => { decide(true); el.querySelector('.row').innerHTML = '<span class="act">validé</span>'; };
      el.querySelector('[data-no]').onclick = () => { decide(false); el.querySelector('.row').innerHTML = '<span class="act">annulé</span>'; };
      botEl = null;
      return;
    }
    if (m.type === 'confirm-gone') {
      const card = chatEl.querySelector(`.card[data-key="${m.key}"] .row`);
      if (card && card.querySelector('button')) card.innerHTML = '<span class="act">expiré · sans réponse à temps</span>';
      return;
    }
    if (m.type === 'done') {
      chatBusy = false;
      chatEl.querySelector('.thinking')?.remove();
      if (m.error) chatAdd('', `<div class="err">${esc(m.error)}</div>`);
      botEl = null;
      // the agent may have changed things behind the scenes
      loadTodo(); loadProjects(); loadAgenda();
      return;
    }
    if (m.type === 'closed') { chatStream?.close(); chatStream = null; }
  };
  chatStream.onerror = () => { chatStream?.close(); chatStream = null; };
}

function chatSend(text) {
  chatShow(true);
  chatBack();
  chatConnect();
  chatAdd('', `<div class="me">${esc(text)}</div>`);
  chatAdd('', '<div class="thinking" aria-label="l\'assistant réfléchit"><i></i><i></i><i></i></div>');
  botEl = null; chatBusy = true;
  fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: chatId, text }) })
    .then(r => r.json()).then(r => { if (r.error) { chatEl.querySelector('.thinking')?.remove(); chatAdd('', `<div class="err">${esc(r.error)}</div>`); chatBusy = false; } });
}

/* ---------- boot ---------- */
(async () => {
  cfg = await api('/api/config');
  chatReplay();   // a reload should not wipe what was already said
  $('#gm-label').textContent = cfg.gmail.label;
  draw();
  await Promise.all([loadGraph(), loadTodo(), loadGmail(), loadRuns(), loadProjects(), loadAgenda(), loadDecks()]);
  setInterval(loadGraph, 30e3);      // second brain edits show up within 30 s
  setInterval(() => loadGmail(), 5 * 60e3);
  setInterval(loadAgenda, 10 * 60e3);
  setInterval(loadProjects, 60e3);
  standupOnOpen();
})();
</script>
