<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpes IA Agentic OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0b0a09; --bg-2: #12100e; --line: #2a2622; --line-2: #1c1916;
    --ink: #ece6dc; --ink-2: #a39a8c; --ink-3: #6b6358;
    --accent: #ff7a1a; --accent-2: #ffb26b; --accent-dim: rgba(255,122,26,.14);
    --good: #7cc48a; --warn: #e6b04a; --crit: #e05a4f;
    --font-d: "Outfit", "Segoe UI", system-ui, sans-serif;
    --font-m: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  :root[data-skin="glacier"] { --accent:#4fd1ff; --accent-2:#a9e8ff; --accent-dim:rgba(79,209,255,.14); --bg:#080a0c; --bg-2:#0d1114; --line:#20272c; --line-2:#161b1f; --ink:#e4ecf1; --ink-2:#93a3ad; --ink-3:#586670; }
  :root[data-skin="sage"] { --accent:#9fd67a; --accent-2:#d2f0b6; --accent-dim:rgba(159,214,122,.14); --bg:#090b09; --bg-2:#0f120e; --line:#22281f; --line-2:#171b15; --ink:#e7ece2; --ink-2:#9aa593; --ink-3:#5f6959; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-d); font-size: 13px; line-height: 1.4; overflow: hidden;
    background-image: radial-gradient(ellipse 55% 50% at 50% 55%, var(--accent-dim) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,.014) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.014) 39px 40px);
  }
  .os { display: grid; grid-template-columns: 330px 1fr 330px; height: 100vh; padding: 14px; position: relative; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col.left { border-right: 1px solid var(--line-2); padding-right: 14px; }
  .col.right { border-left: 1px solid var(--line-2); padding-left: 14px; }

  .w { padding: 14px 4px 18px; border-bottom: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .w:last-child { border-bottom: 0; flex: 1; }
  .col.left > .w:first-child { flex: 1 1 55%; overflow: hidden; }
  .w-head { display: flex; align-items: center; gap: 10px; }
  .w-head h2 { margin: 0; font: 500 15px/1 var(--font-d); letter-spacing: .22em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .w-head h2 svg { width: 14px; height: 14px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
  .w-head .meta { margin-left: auto; font: 500 9px/1 var(--font-m); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .btn { font: 600 9px/1 var(--font-m); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.acc { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible, .todo input:focus-visible + label, .mapp:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .lbl { font: 500 9px/1 var(--font-m); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
  .num { font: 300 40px/1 var(--font-d); color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .tag { font: 600 8.5px/1 var(--font-m); letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-2); }
  .tag.acc { color: var(--accent); border-color: var(--accent); }

  /* gmail */
  #gmail { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
  .mails { display: grid; gap: 4px; overflow-y: auto; flex: 1 1 0; min-height: 0; align-content: start; }
  .mail small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mail { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: start; padding: 7px 6px; border-radius: 4px; cursor: pointer; }
  .mail:hover { background: var(--bg-2); }
  a.mail { text-decoration: none; color: inherit; }
  .mail .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; background: var(--ink-3); }
  .mail.unread .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .mail b { display: block; font-weight: 600; font-size: 12.5px; }
  .mail.unread b { color: var(--ink); } .mail b { color: var(--ink-2); }
  .mail small { display: block; color: var(--ink-3); font-size: 11px; margin-top: 1px; }
  .mail .from { font: 500 9px/1 var(--font-m); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 3px; }
  .mail .when { font: 500 10px/1 var(--font-m); color: var(--ink-3); margin-top: 5px; }

  /* todo */
  .todo { display: grid; gap: 2px; }
  .todo .it { display: grid; grid-template-columns: 16px 1fr auto auto; gap: 10px; align-items: center; padding: 6px 6px; border-radius: 4px; }
  .todo .it:hover { background: var(--bg-2); }
  .todo input { position: absolute; opacity: 0; width: 0; height: 0; }
  .todo label.box { width: 14px; height: 14px; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; display: grid; place-items: center; }
  .todo label.box svg { width: 10px; height: 10px; stroke: var(--bg); stroke-width: 3; fill: none; opacity: 0; }
  .todo input:checked + label.box { background: var(--accent); border-color: var(--accent); }
  .todo input:checked + label.box svg { opacity: 1; }
  .todo .tx { font-size: 12.5px; font-weight: 500; }
  .todo .tx small { display: block; font: 500 9.5px/1.4 var(--font-m); color: var(--ink-3); }
  .todo input:checked ~ .tx { color: var(--ink-3); text-decoration: line-through; }
  .todo .pr { width: 4px; height: 18px; border-radius: 2px; background: var(--line); }
  .todo .pr.h { background: var(--crit); } .todo .pr.m { background: var(--warn); }
  .prog { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
  .prog .bar { height: 4px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
  .prog .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .prog span { font: 600 10px/1 var(--font-m); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .add { display: flex; gap: 8px; align-items: center; border: 1px dashed var(--line); border-radius: 4px; padding: 7px 8px; }
  .add input { flex: 1; background: transparent; border: 0; color: var(--ink); font: 400 12px var(--font-d); outline: none; }
  .add input::placeholder { color: var(--ink-3); }

  /* micro apps */
  .mapp { border: 1px solid var(--line-2); background: var(--bg-2); border-radius: 8px; padding: 14px; display: grid; gap: 10px; cursor: pointer; position: relative; overflow: hidden; }
  .mapp::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120px 60px at 100% 0%, var(--accent-dim), transparent); opacity: 0; transition: opacity .25s; }
  .mapp:hover { border-color: var(--line); } .mapp:hover::before { opacity: 1; }
  .mapp .top { display: flex; align-items: center; gap: 10px; }
  .mapp .ic { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; background: var(--bg); }
  .mapp .ic svg { width: 17px; height: 17px; stroke: var(--accent); fill: none; stroke-width: 1.6; }
  .mapp b { font: 600 14px/1.2 var(--font-d); display: block; }
  .mapp .sub { color: var(--ink-3); font-size: 11px; }
  .mapp .skills { display: flex; gap: 4px; flex-wrap: wrap; }
  .mapp .skills span { font: 500 9px/1 var(--font-m); color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 3px 5px; }
  .mapp .recent { display: grid; gap: 4px; border-top: 1px solid var(--line-2); padding-top: 8px; }
  .mapp .recent div { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-2); }
  .mapp .recent span { font: 500 9.5px/1 var(--font-m); color: var(--ink-3); }
  .mapp .act { display: flex; gap: 6px; }

  /* centre */
  .core { position: relative; min-width: 0; }
  .core canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .brand { position: absolute; top: 24px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
  .brand h1 { margin: 0; font: 700 28px/1 var(--font-d); letter-spacing: .02em; display: inline-flex; gap: 12px; align-items: center; }
  .brand h1 svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
  .brand h1 span { font-weight: 400; color: var(--accent); }
  .brand p { margin: 8px 0 0; font: 500 10.5px/1 var(--font-m); letter-spacing: .28em; text-transform: uppercase; color: var(--ink-2); }
  .hud { position: absolute; top: 24px; left: 18px; display: grid; gap: 6px; font: 500 9.5px/1.5 var(--font-m); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); z-index: 2; pointer-events: none; }
  .hud b { color: var(--ink-2); font-weight: 500; }
  .zoom { position: absolute; right: 18px; top: 24px; display: grid; gap: 4px; z-index: 2; }
  .zoom button { width: 28px; height: 28px; border: 1px solid var(--line); background: rgba(11,10,9,.8); color: var(--ink-2); border-radius: 4px; cursor: pointer; font: 500 14px var(--font-m); }
  .zoom button:hover { border-color: var(--accent); color: var(--accent); }

  .legend { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 2; }
  .doms { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
  .dom { display: inline-flex; align-items: center; gap: 6px; font: 500 9.5px/1 var(--font-m); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--line-2); padding: 6px 9px; border-radius: 20px; cursor: pointer; background: rgba(11,10,9,.75); }
  .dom i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
  .dom:hover, .dom.on { border-color: var(--c); color: var(--ink); }
  .dom.off { opacity: .35; }
  .search { display: flex; align-items: center; gap: 10px; width: 420px; max-width: 80%; border: 1px solid var(--line); background: rgba(11,10,9,.85); border-radius: 6px; padding: 9px 12px; }
  .search svg { width: 14px; height: 14px; stroke: var(--ink-3); fill: none; stroke-width: 1.8; }
  .search input { flex: 1; background: transparent; border: 0; color: var(--ink); font: 400 12.5px var(--font-d); outline: none; }
  .search input::placeholder { color: var(--ink-3); }
  .search kbd { font: 500 9px/1 var(--font-m); border: 1px solid var(--line); border-radius: 3px; padding: 3px 5px; color: var(--ink-3); }

  .panel { position: absolute; right: 18px; top: 70px; width: 400px; min-width: 300px; max-width: 70%; resize: horizontal; direction: rtl; max-height: calc(100% - 200px); overflow: auto; background: rgba(18,16,14,.94); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: none; gap: 10px; z-index: 4; backdrop-filter: blur(6px); }
  .panel.on { display: grid; }
  .panel > * { direction: ltr; }
  .panel .hd { display: flex; align-items: center; gap: 8px; }
  .panel .hd .dm { flex: 1; }
  .panel .icobtn { width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; font: 500 13px/1 var(--font-m); flex-shrink: 0; }
  .panel .icobtn:hover { border-color: var(--accent); color: var(--accent); }
  .panel .icobtn:disabled { opacity: .3; cursor: default; }
  .panel .icobtn:disabled:hover { border-color: var(--line); color: var(--ink-2); }
  .panel .dm { font: 500 9px/1 var(--font-m); letter-spacing: .16em; text-transform: uppercase; }
  .panel b.t { font: 600 17px/1.25 var(--font-d); text-wrap: balance; }
  .panel .path { font: 400 10px/1.4 var(--font-m); color: var(--ink-3); word-break: break-all; }
  .panel .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .panel .links { display: grid; gap: 3px; }
  .panel .links div { display: grid; grid-template-columns: 8px 1fr; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); cursor: pointer; padding: 3px 4px; border-radius: 3px; }
  .panel .links div:hover { background: var(--bg); color: var(--ink); }
  .panel .links i { width: 6px; height: 6px; border-radius: 50%; }
  .panel .row { display: flex; gap: 6px; }
  .st { font: 600 8.5px/1 var(--font-m); letter-spacing: .1em; text-transform: uppercase; }
  .st.v { color: var(--good); } .st.d { color: var(--warn); }

  .skins { position: absolute; top: 5px; right: 16px; display: flex; gap: 4px; z-index: 7; }
  .skins button { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; background: var(--c); }
  .skins button.on { border-color: var(--ink); }
  .demo { position: absolute; left: 50%; top: 3px; transform: translateX(-50%); font: 500 8.5px/1 var(--font-m); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); z-index: 7; }
  @media (max-width: 1180px) { .os { grid-template-columns: 290px 1fr 290px; } }

  /* ---- dashboard additions (live version) ---- */
  .icobtn { width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; font: 500 13px/1 var(--font-m); flex-shrink: 0; }
  .icobtn:hover { border-color: var(--accent); color: var(--accent); }
  .icobtn:disabled { opacity: .3; cursor: default; }
  .panel .hd { display: flex; align-items: center; gap: 8px; }
  .panel .hd .dm { flex: 1; }
  .panel .body { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; max-height: 40vh; overflow: auto; border-top: 1px solid var(--line-2); padding-top: 8px; }
  .panel .body h1, .panel .body h2, .panel .body h3 { font: 600 14px/1.3 var(--font-d); color: var(--ink); margin: 8px 0 3px; }
  .panel .body p { margin: 0 0 6px; } .panel .body ul { margin: 0 0 6px; padding-left: 16px; } .panel .body a { color: var(--accent); }
  .auth { display: grid; gap: 8px; }
  .auth p { margin: 0; color: var(--ink-2); font-size: 12px; }
  .auth code { font: 400 10px var(--font-m); color: var(--ink-3); word-break: break-all; }
  .mapp .form { display: none; }
  .arts { display: grid; gap: 4px; }
  .art { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 4px; font-size: 12px; text-decoration: none; color: var(--ink-2); }
  .art:hover { background: var(--bg-2); color: var(--ink); }
  .art svg { width: 12px; height: 12px; stroke: var(--ink-3); fill: none; stroke-width: 1.6; }
  .art span { font: 500 9.5px/1 var(--font-m); color: var(--ink-3); }
  .run { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: center; font-size: 11.5px; padding: 4px 6px; }
  .run i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
  .run.running i { background: var(--warn); box-shadow: 0 0 6px var(--warn); animation: blink 1s infinite; }
  .run.done i { background: var(--good); } .run.failed i { background: var(--crit); }
  .run span { font: 500 9px/1 var(--font-m); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  @keyframes blink { 50% { opacity: .3; } }
  .modal[hidden] { display: none; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 20; }
  .dlg { width: 520px; max-width: 92vw; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 12px; }
  .dlg textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); font: 400 13px/1.5 var(--font-d); padding: 10px; resize: vertical; outline: none; }
  .dlg textarea:focus { border-color: var(--accent); }
  .dlg select { background: var(--bg); }
  .todo .it.carried .tx small { color: var(--warn); }
  .todo .del { opacity: 0; font: 500 12px var(--font-m); color: var(--ink-3); cursor: pointer; border: 0; background: transparent; }
  .todo .it:hover .del { opacity: 1; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></symbol>
    <symbol id="i-euro" viewBox="0 0 24 24"><path d="M18 6a7 7 0 1 0 0 12M4 10h10M4 14h10"/></symbol>
    <symbol id="i-course" viewBox="0 0 24 24"><path d="M3 6h7a3 3 0 0 1 3 3v11a2 2 0 0 0-2-2H3z"/><path d="M21 6h-7a3 3 0 0 0-3 3v11a2 2 0 0 1 2-2h8z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-hex" viewBox="0 0 24 24"><path d="M12 2l8 4.6v9.2L12 20.5 4 15.8V6.6z"/><path d="M12 7l4 2.3v4.6L12 16l-4-2.1V9.3z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h2M9 6h11M4 12h2M9 12h11M4 18h2M9 18h11"/></symbol>
  </defs>
</svg>

<div class="skins" aria-label="Skin">
  <button class="on" data-skin="ember" style="--c:#ff7a1a" title="Ember"></button>
  <button data-skin="glacier" style="--c:#4fd1ff" title="Glacier"></button>
  <button data-skin="sage" style="--c:#9fd67a" title="Sauge"></button>
</div>

<div class="os">
  <aside class="col left">
    <section class="w">
      <div class="w-head">
        <h2><svg><use href="#i-mail"/></svg>Gmail</h2>
        <span class="tag acc" id="gm-label">ALPES-IA</span>
        <span class="meta" id="gm-sync">—</span>
      </div>
      <div id="gmail"><span class="lbl">Chargement…</span></div>
    </section>

    <section class="w">
      <div class="w-head">
        <h2><svg><use href="#i-list"/></svg>Aujourd'hui</h2>
        <span class="meta" id="today"></span>
      </div>
      <div class="prog"><div class="bar"><i id="pbar"></i></div><span id="pcount">0/0</span></div>
      <div class="todo" id="todo"></div>
      <div class="add"><span class="lbl">+</span><input id="newtodo" placeholder="Ajouter une tâche, Entrée pour valider · !! = urgent"></div>
      <span class="lbl" id="todo-src"></span>
    </section>
  </aside>

  <main class="core">
    <canvas id="g"></canvas>
    <header class="brand">
      <h1><svg><use href="#i-hex"/></svg>ALPES IA <span>Agentic OS</span></h1>
      <p>Second brain · <span id="stats">—</span></p>
    </header>
    <div class="hud">
      <div><b>Glisser</b> déplacer · <b>Molette</b> zoomer</div>
      <div><b>Clic</b> connexions · <b>Échap</b> réinitialiser</div>
    </div>
    <div class="zoom"><button id="z+">+</button><button id="z-">−</button><button id="z0" title="Recentrer">◎</button></div>
    <div class="panel" id="panel"></div>
    <div class="legend">
      <div class="doms" id="doms"></div>
      <label class="search"><svg><use href="#i-search"/></svg><input id="q" type="search" placeholder="Chercher un concept, un client, un projet…"><kbd>⌘K</kbd></label>
    </div>
  </main>

  <aside class="col right">
    <section class="w">
      <div class="w-head">
        <h2><svg><use href="#i-grid"/></svg>Micro apps</h2>
        <span class="meta">headless · claude -p</span>
      </div>
      <div id="apps"></div>
    </section>
    <section class="w">
      <div class="w-head">
        <h2><svg><use href="#i-file"/></svg>Artifacts</h2>
        <span class="meta" id="runs-meta"></span>
      </div>
      <div class="arts" id="artifacts"></div>
    </section>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="dlg">
    <div class="w-head"><h2 id="m-title"></h2><button class="icobtn" id="m-close">×</button></div>
    <textarea id="m-brief" rows="6"></textarea>
    <div class="row" style="display:flex;gap:8px;align-items:center">
      <select id="m-model" class="btn"><option value="claude-sonnet-5">Sonnet 5</option><option value="claude-opus-5">Opus 5</option><option value="claude-fable-5-1">Fable 5.1</option></select>
      <span style="flex:1"></span>

<script>

/* ---------- todo (brain/journal/todo.md in the second brain) ---------- */
let todo = { items: [], carried: [] };
async function loadTodo() { todo = await api('/api/todo'); renderTodo(); }

function renderTodo() {

  el.innerHTML = todo.items.map((t, i) => row(t, i, false)).join('') + todo.carried.map((t, i) => row(t, i, true)).join('');

}
$('#todo').addEventListener('change', e => {

});
$('#todo').addEventListener('click', e => { if (e.target.classList.contains('del')) { todo.items.splice(+e.target.dataset.i, 1); saveTodo(); } });

  if (t.endsWith('!!')) { p = 'h'; t = t.slice(0, -2).trim(); } else if (t.endsWith('!')) { p = 'm'; t = t.slice(0, -1).trim(); }

});

/* ---------- graph (Obsidian-style, force-directed) ---------- */
const DOMS = {
  knowledge: { c: '#7fd1ff', label: 'Knowledge' }, clients: { c: '#ffb26b', label: 'Clients' }, projects: { c: '#ff8fa3', label: 'Projets' },
  finance: { c: '#b8f2a0', label: 'Finance' }, stack: { c: '#c9a7ff', label: 'Stack' }, maintenance: { c: '#f5a97f', label: 'Maintenance' },
  journal: { c: '#f5e8a0', label: 'Journal' }, inbox: { c: '#9ad4d0', label: 'Inbox' }, skills: { c: '#e0c3ff', label: 'Skills' }, root: { c: '#ece6dc', label: 'Racine' },

const domOf = d => DOMS[d] ?? (DOMS[d] = { c: '#bdb5a8', label: d });
let nodes = [], edges = [], byId = {}, domKeys = [];
const cv = $('#g'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, DPR = 1;
const cam = { x: 0, y: 0, k: 1 };

const toWorld = (sx, sy) => [(sx - W / 2) / cam.k - cam.x, (sy - H / 2) / cam.k - cam.y];
let alpha = 1, selected = null, hover = null, activeDom = null, query = '';
const visible = n => (!activeDom || n.d === activeDom) && (!query || (n.t + ' ' + n.id + ' ' + n.tags.join(' ')).toLowerCase().includes(query));

async function loadGraph() {
  const g = await api('/api/graph');
  const prev = Object.fromEntries(nodes.map(n => [n.id, n]));
  byId = {}; nodes = g.nodes.map(n => { const o = prev[n.id]; const m = { ...n, nb: new Set(), deg: 0, x: o?.x ?? (Math.random() - .5) * 400, y: o?.y ?? (Math.random() - .5) * 400, vx: 0, vy: 0 }; byId[n.id] = m; return m; });

  if (!Object.keys(prev).length) domKeys.forEach((k, i) => { const a = i / domKeys.length * Math.PI * 2, R = k === 'knowledge' ? 0 : 260; nodes.filter(n => n.d === k).forEach(n => { n.x = Math.cos(a) * R + (Math.random() - .5) * 200; n.y = Math.sin(a) * R + (Math.random() - .5) * 200; }); });
  const changed = Object.keys(prev).length !== nodes.length || edges.length !== (window.__edgeCount ?? -1); window.__edgeCount = edges.length;

  $('#stats').textContent = `${nodes.length} fichiers · ${edges.length} liens · ${domKeys.length} domaines`;
  renderDoms();
  if (selected) selected = byId[selected.id] ?? null;
}
function renderDoms() {
  const el = $('#doms'); el.innerHTML = '';
  domKeys.forEach(k => { const n = nodes.filter(f => f.d === k).length; const b = document.createElement('button'); b.className = 'dom' + (activeDom === k ? ' on' : activeDom ? ' off' : ''); b.dataset.k = k; b.style.setProperty('--c', domOf(k).c); b.innerHTML = `<i></i>${domOf(k).label} <span style="opacity:.6">${n}</span>`; b.onclick = () => { activeDom = activeDom === k ? null : k; renderDoms(); }; el.appendChild(b); });

function step() {

const hex = (h, a) => h + Math.round(Math.max(0, Math.min(1, a)) * 255).toString(16).padStart(2, '0');
function draw() {
  step();

    if (lit && !reduce) { const p = (t * .35 + (e.a.x + e.b.y) * .001) % 1; ctx.fillStyle = hex(accent, .9); ctx.beginPath(); ctx.arc(e.a.x + (e.b.x - e.a.x) * p, e.a.y + (e.b.y - e.a.y) * p, 1.6 / cam.k, 0, 7); ctx.fill(); }
  }

    const c = domOf(n.d).c, isF = n === focus, isNb = focus && focus.nb.has(n), dim = (focus && !isF && !isNb) || !visible(n);

    ctx.fillStyle = hex(c, dim ? .12 : 1); ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 7); ctx.fill();

  }

    for (const n of labels) {
      const isF = n === focus, fs = (isF ? 14 : 11.5) / cam.k;

      const w = ctx.measureText(n.t).width + 8 / cam.k, h = fs * 1.5;

      for (let k = 0; k < 8; k++) { const hit = placed.find(b => x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y); if (!hit) break; y = hit.y + hit.h + 2 / cam.k; }
      placed.push({ x, y, w, h });
      ctx.fillStyle = 'rgba(11,10,9,.82)'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = isF ? '#fff' : hex(domOf(n.d).c, .95); ctx.fillText(n.t, x + 4 / cam.k, y + h / 2);
      if (Math.abs(y + h / 2 - n.y) > 2) { ctx.strokeStyle = hex(domOf(n.d).c, .4); ctx.lineWidth = .8 / cam.k; ctx.beginPath(); ctx.moveTo(left ? x + w : x, y + h / 2); ctx.lineTo(n.x, n.y); ctx.stroke(); }

}
let drag = null, panStart = null, moved = false;
const pick = (sx, sy) => { const [x, y] = toWorld(sx, sy); let best = null, bd = 12 / cam.k; for (const n of nodes) { const d = Math.hypot(n.x - x, n.y - y) - n.r; if (d < bd) { bd = d; best = n; } } return best; };

document.getElementById('z+').onclick = () => cam.k = Math.min(5, cam.k * 1.25);

/* selection panel with the note body */
const panel = $('#panel'), history = [];

async function select(n, fromNav) {
  if (!fromNav && selected && n && n !== selected) history.push(selected);
  if (!n) history.length = 0;
  selected = n; if (!n) { panel.classList.remove('on'); return; }

    <b class="t">${esc(n.t)}</b><div class="path">second-brain/${esc(n.id)}</div>
    <div class="tags">${n.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}${n.st ? `<span class="st ${n.st === 'verified' ? 'v' : 'd'}" style="align-self:center">${n.st === 'verified' ? '● verified' : '○ ' + esc(n.st)}</span>` : ''}</div>
    ${n.desc ? `<p style="margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-2)">${esc(n.desc)}</p>` : ''}
    <span class="lbl">${links.length} connexion${links.length > 1 ? 's' : ''}</span>
    <div class="links">${links.map(m => `<div data-id="${esc(m.id)}"><i style="background:${domOf(m.d).c}"></i>${esc(m.t)}</div>`).join('')}</div>
    <div class="body" id="pv-body"><span class="lbl">Chargement…</span></div>
    <div class="row"><button class="btn acc" id="pv-copy">Copier le chemin</button><button class="btn" id="pv-center">Centrer</button></div>`;
  panel.classList.add('on');
  panel.querySelectorAll('.links div').forEach(el => el.onclick = () => { const m = byId[el.dataset.id]; select(m); center(m); });
  panel.querySelector('#pv-copy').onclick = e => { navigator.clipboard?.writeText(`${cfg.secondBrain}/${n.id}`); e.target.textContent = 'Copié ✓'; setTimeout(() => e.target.textContent = 'Copier le chemin', 1200); };
  panel.querySelector('#pv-center').onclick = () => center(n);
  panel.querySelector('#pv-close').onclick = () => select(null);
  panel.querySelector('#pv-back').onclick = () => { const m = history.pop(); if (m) { select(m, true); center(m); } };
  const note = await api('/api/note?id=' + encodeURIComponent(n.id));
  if (selected !== n) return;
  const body = panel.querySelector('#pv-body'); body.innerHTML = note.body ? md(note.body) : '<span class="lbl">Vide</span>';
  body.querySelectorAll('a[data-link]').forEach(a => a.onclick = () => { const target = new URL(a.dataset.link, 'file:///' + n.id).pathname.slice(1); const m = byId[target]; if (m) { select(m); center(m); } });
}
function center(n) { const t0 = performance.now(), fx = cam.x, fy = cam.y, fk = cam.k, tk = Math.max(cam.k, 1.8); const off = panel.classList.contains('on') ? (panel.offsetWidth / 2 + 24) / tk : 0; /* keep the node clear of the panel */ (function anim() { const p = Math.min(1, (performance.now() - t0) / 450), e = 1 - Math.pow(1 - p, 3); cam.k = fk + (tk - fk) * e; cam.x = fx + (-n.x - off - fx) * e; cam.y = fy + (-n.y - fy) * e; if (p < 1) requestAnimationFrame(anim); })(); }
const q = $('#q');
q.addEventListener('input', () => query = q.value.trim().toLowerCase());
addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); } if (e.key === 'Escape') { q.value = ''; query = ''; q.blur(); select(null); $('#modal').hidden = true; } });

/* ---------- boot ---------- */
(async () => {
  cfg = await api('/api/config');
  $('#gm-label').textContent = cfg.gmail.label;
  draw();
  await Promise.all([loadGraph(), loadTodo(), loadGmail(), loadRuns()]);
  setInterval(loadGraph, 30e3);      // second brain edits show up within 30 s
  setInterval(() => loadGmail(), 5 * 60e3);
})();
</script>
